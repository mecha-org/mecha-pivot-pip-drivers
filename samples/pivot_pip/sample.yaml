sample:
  name: Mecha Pivot Pip
  description: Report the motion of a simulated Pivot Pip through the input subsystem.

tests:
  sample.mecha.pivot_pip:
    tags: mecha_pivot_pip
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Pivot Pip sample: pushing the stick to the right"
        - "pointer moved x by"
        - "Pivot Pip sample: done"
