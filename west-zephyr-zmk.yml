# The Zephyr that ZMK builds on, which is a ZMK fork of Zephyr.
#
# This is the workspace for developing and testing the module on its own. Products do
# not use it: they list this repository in their own manifest, and west ignores the
# manifest of a project that is not imported.
#
# Select it with: west init -l --mf west-zephyr-zmk.yml mecha-pivot-pip-zephyr
#
# ZMK sets its Zephyr in app/west.yml of https://github.com/zmkfirmware/zmk

manifest:
  projects:
    - name: zephyr
      url: https://github.com/zmkfirmware/zephyr
      revision: v4.1.0+zmk-fixes
      west-commands: scripts/west-commands.yml
  self:
    path: mecha-pivot-pip-zephyr
